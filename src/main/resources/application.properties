# ==============================
# APP CONFIG
# ==============================
spring.application.name=ResolveHub
server.port=${PORT:8080}

# ==============================
# DATABASE CONFIG (RAILWAY / CLOUD SAFE)
# ==============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari connection pool (important for cloud stability)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# ==============================
# JPA / HIBERNATE
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# IMPORTANT: lets Hibernate detect Postgres properly
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# LOGGING (optional but useful)
# ==============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

# ==============================
# OPTIONAL: prevent startup DB crash visibility issues
# ==============================
spring.sql.init.mode=never