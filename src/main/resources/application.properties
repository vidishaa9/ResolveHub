# =====================
# SERVER
# =====================
server.port=8080

# =====================
# DATABASE (PostgreSQL)
# =====================
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:resolvehub}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# IMPORTANT (prevents startup crash if DB is down)
spring.jpa.defer-datasource-initialization=true

# =====================
# HIKARI POOL (optional but good)
# =====================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# =====================
# JWT
# =====================
jwt.secret=9f3c2a7b8d1e4f6a9c3d2e1f7b8a9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6
jwt.expiration=86400000

# =====================
# SPRING SECURITY DEBUG (OFF in prod)
# =====================
logging.level.org.springframework.security=INFO

# =====================
# OPTIONAL: better error logs
# =====================
server.error.include-message=always